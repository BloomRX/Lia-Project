name: Lia nativa no Windows

on:
  push:
    branches: [main]
    paths: ['lia/**', 'Lia.bat', 'Tests/tools/lia-brain-consumers.test.mjs', 'Tests/tools/lia-contract-consumers.test.mjs', '.github/workflows/lia-native-windows.yml']
  pull_request:
    branches: [main]
    paths: ['lia/**', 'Lia.bat', 'Tests/tools/lia-brain-consumers.test.mjs', 'Tests/tools/lia-contract-consumers.test.mjs', '.github/workflows/lia-native-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-write:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
      - name: Isolar escrita privada no Windows
        shell: pwsh
        run: |
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'lia-test-temp'
          New-Item -ItemType Directory -Path $fixtureTemp | Out-Null
          $env:TEMP = $fixtureTemp
          $env:TMP = $fixtureTemp
          node --experimental-strip-types lia/runtime/scripts/check-windows-private-file.mjs
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
      - name: Preparar Corepack
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = Join-Path $env:RUNNER_TEMP 'lia-corepack'
          npm install --prefix $toolchain --no-audit --no-fund corepack@0.36.0
          $bin = Join-Path $toolchain 'node_modules/.bin'
          & (Join-Path $bin 'corepack.cmd') enable --install-directory $bin pnpm
          $bin >> $env:GITHUB_PATH
      - name: Extrair a árvore própria sem o diretório legado
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $standalone = Join-Path $env:RUNNER_TEMP 'lia-native'
          $archive = Join-Path $env:RUNNER_TEMP 'lia-native.tar'
          New-Item -ItemType Directory -Path $standalone | Out-Null
          git archive --format=tar --output=$archive HEAD
          tar -xf $archive -C $standalone
          if (Test-Path (Join-Path $standalone 'airi')) {
            throw 'O gate exige uma árvore sem airi/.'
          }
          # Windows pode fornecer TEMP com um alias 8.3 contendo til. Os testes
          # constroem um LocalAppData sintético a partir desse diretório.
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'lia-test-temp'
          New-Item -ItemType Directory -Path $fixtureTemp | Out-Null
          "TEMP=$fixtureTemp" >> $env:GITHUB_ENV
          "TMP=$fixtureTemp" >> $env:GITHUB_ENV
          "LIA_STANDALONE=$standalone" >> $env:GITHUB_ENV
      - name: Verificar a fronteira cognitiva na árvore própria
        run: |
          Set-Location $env:LIA_STANDALONE
          node --test Tests/tools/lia-brain-consumers.test.mjs Tests/tools/lia-contract-consumers.test.mjs
      - name: Preparar pela entrada oficial
        id: build-launcher
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:LIA_STANDALONE
          .\Lia.bat -PrepareOnly
      - name: Executar as suítes e verificações próprias
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          Set-Location $env:LIA_STANDALONE
          .\lia\Test-Lia.ps1
      - name: Abrir e encerrar o Stage pelo Launcher
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          node --experimental-strip-types scripts/check-native-stage.mjs --require-independent
      - name: Validar presença do avatar
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          node --experimental-strip-types scripts/check-native-presence.mjs
      - name: Validar histórico e persistência da voz local
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          node scripts/check-native-history.mjs --kokoro-voice=pm_alex
      - name: Validar imagem e transcrição por HTTPS local
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $gitFolder = Split-Path (Split-Path (Get-Command git.exe).Source)
          $openssl = Join-Path $gitFolder 'usr/bin/openssl.exe'
          $cert = Join-Path $env:RUNNER_TEMP 'lia-vision-certificate.pem'
          $key = Join-Path $env:RUNNER_TEMP 'lia-vision-key.pem'
          & $openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Lia fixture' -addext 'subjectAltName=IP:127.0.0.1,IP:127.0.0.2' -keyout $key -out $cert
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          node --experimental-strip-types scripts/check-native-vision.mjs $cert $key
          node --experimental-strip-types scripts/check-native-stt-consent.mjs $cert $key
          node --experimental-strip-types scripts/check-native-stt-consent.mjs --local
          node --experimental-strip-types scripts/check-native-speech.mjs $cert $key
          node scripts/check-native-alltalk.mjs
      - name: Testar sessão OIDC nativa com emissor local
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          corepack pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-native-oidc.mjs
      - name: Gerar e testar o instalador privado
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          node scripts/package-windows.mjs --internal-test
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "dist/windows-native-preview/LiaPreviewSetup-$version-x64.exe"
          .\scripts\check-native-install.ps1 -Installer $installer.FullName -EvidenceRoot $env:RUNNER_TEMP -RequireIndependent -DirectStageConversation -RequireAttribution -RequireBranding
      - name: Validar atualização privada do perfil
        if: ${{ !cancelled() && steps.build-launcher.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:LIA_STANDALONE 'lia/desktop')
          $version = [version](Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $next = "0.0.$($version.Build + 1)"
          $previous = Get-Item -LiteralPath "dist/windows-native-preview/LiaPreviewSetup-$version-x64.exe"
          node scripts/package-windows.mjs --internal-test "--upgrade-test-version=$next"
          $candidate = Get-Item -LiteralPath "dist/windows-native-preview/LiaPreviewSetup-$next-x64.exe"
          .\scripts\check-native-install.ps1 -PreviousInstaller $previous.FullName -Installer $candidate.FullName -EvidenceRoot $env:RUNNER_TEMP -RequireIndependent -RequireAttribution -RequireBranding
      - name: Preservar evidências do Stage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lia-native-stage
          path: |
            ${{ runner.temp }}/lia-native-stage-*/report.json
            ${{ runner.temp }}/lia-native-stage-*/lifecycle-failure.json
            ${{ runner.temp }}/lia-native-presence-*/report.json
            ${{ runner.temp }}/lia-native-presence-*/overlay.png
            ${{ runner.temp }}/lia-native-presence-*/overlay-animated.png
            ${{ runner.temp }}/lia-native-history-*/report.json
            ${{ runner.temp }}/lia-native-history-*/history.png
            ${{ runner.temp }}/lia-native-history-*/kokoro-selection.png
            ${{ runner.temp }}/lia-native-history-*/memory-cleared.png
            ${{ runner.temp }}/lia-native-history-*/conversations.png
            ${{ runner.temp }}/lia-native-history-*/personality.png
            ${{ runner.temp }}/lia-native-history-*/traits.png
            ${{ runner.temp }}/lia-native-history-*/hub-catalog.png
            ${{ runner.temp }}/lia-native-vision-*/report.json
            ${{ runner.temp }}/lia-native-vision-*/stage.png
            ${{ runner.temp }}/lia-native-stt-*/report.json
            ${{ runner.temp }}/lia-native-speech-*/report.json
            ${{ runner.temp }}/lia-native-alltalk-*/report.json
            ${{ runner.temp }}/lia-native-alltalk-*/selection.png
            ${{ runner.temp }}/lia-native-oidc-*/report.json
            ${{ runner.temp }}/lia-native-oidc-*/account-panel.png
            ${{ runner.temp }}/lia-native-speech-*/speech-settings.png
            ${{ runner.temp }}/lia-native-stt-*/microphone.png
            ${{ runner.temp }}/lia-native-stt-*/transcription-settings.png
            ${{ runner.temp }}/lia-native-install-*/report.json
          if-no-files-found: ignore
