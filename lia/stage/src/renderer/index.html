<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob:; img-src blob:; connect-src blob:; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lia</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #171421; color: #f5efff; }
      body { margin: 0; }
      main { display: grid; gap: 1rem; padding: 1.25rem; }
      h1, p { margin: 0; }
      #messages { display: grid; align-content: start; gap: .75rem; min-height: 9rem; max-height: 45vh; overflow: auto; }
      .message { background: #292239; border-radius: .65rem; padding: .7rem .85rem; overflow-wrap: anywhere; white-space: pre-wrap; }
      form { display: grid; gap: .65rem; }
      textarea, button { font: inherit; border: 1px solid #786a92; border-radius: .5rem; padding: .6rem; }
      textarea { background: #221c30; color: inherit; resize: vertical; }
      button { min-width: 6rem; background: #36294f; color: inherit; }
      button[type="submit"] { background: #dbc4ff; color: #211634; }
      button:disabled { opacity: .55; }
      :focus-visible { outline: 3px solid #e3bcff; outline-offset: 3px; }
      #status { min-height: 1.6em; color: #d6c7e7; }
      #avatar-canvas { width: 100%; height: 16rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Conversa com Lia</h1>
      <div id="messages" role="log" aria-label="Mensagens" tabindex="0"></div>
      <form>
        <label for="message">Mensagem</label>
        <textarea id="message" rows="3" maxlength="8000" required></textarea>
        <div>
          <button type="submit">Enviar</button>
          <button id="cancel" type="button" disabled>Cancelar</button>
        </div>
      </form>
      <div>
        <button id="record" type="button">Gravar mensagem</button>
        <button id="record-cancel" type="button" disabled>Cancelar gravação</button>
        <p id="record-status" role="status"></p>
      </div>
      <div id="voice" hidden>
        <button id="speak" type="button">Ouvir resposta</button>
        <audio controls hidden aria-label="Resposta da Lia"></audio>
        <p id="voice-status" role="status"></p>
      </div>
      <p id="status" role="status"></p>
      <details>
        <summary>Histórico da conversa</summary>
        <p>Guarda até 24 trocas neste perfil. As mais recentes podem voltar à conversa quando você usar a mesma conexão de IA.</p>
        <label><input id="history-enabled" type="checkbox" disabled> Guardar histórico</label>
        <button id="history-clear" type="button" disabled>Limpar conversa</button>
        <p id="history-status" role="status"></p>
      </details>
      <details id="avatar">
        <summary>Avatar</summary>
        <label for="avatar-file">Abrir avatar VRM</label>
        <input id="avatar-file" type="file" accept=".vrm">
        <canvas id="avatar-canvas" hidden aria-label="Prévia do avatar"></canvas>
        <div id="avatar-actions" hidden>
          <button id="avatar-show" type="button">Mostrar no desktop</button>
          <button id="avatar-hide" type="button" disabled>Ocultar do desktop</button>
          <button type="button" data-presence="paused" disabled>Pausar ou retomar</button>
          <button type="button" data-presence="pinned" disabled>Fixar ou soltar</button>
          <button type="button" data-presence="home" disabled>Voltar ao início</button>
          <button type="button" data-presence="set-home" disabled>Salvar posição inicial</button>
        </div>
        <p id="avatar-status" role="status"></p>
      </details>
      <details>
        <summary>Memória</summary>
        <p>As notas ficam neste perfil e só entram em conversas com a IA local.</p>
        <fieldset id="memory-controls" disabled>
          <label><input id="memory-enabled" type="checkbox"> Usar minhas notas</label>
          <div>
            <label for="memory-note">Nova nota</label>
            <textarea id="memory-note" rows="2" maxlength="500"></textarea>
            <button id="memory-save" type="button">Salvar nota</button>
          </div>
          <ul id="memory-entries" aria-label="Notas salvas"></ul>
        </fieldset>
        <p id="memory-status" role="status"></p>
      </details>
    </main>
    <script type="module" src="./chat.js"></script>
    <script type="module" src="./recording.js"></script>
    <script type="module" src="./memory.js"></script>
    <script type="module" src="./avatar.js"></script>
  </body>
</html>
